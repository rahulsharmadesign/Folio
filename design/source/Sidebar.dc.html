<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folio sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Folio" style="width: 232px; height: 800px; box-sizing: border-box; background: #EEE7D8; border-right: 1px solid #E1D8C6; display: flex; flex-direction: column; padding: 18px 12px 18px; font-family: Geist, 'Helvetica Neue', Helvetica, sans-serif; color: #23201B; position: relative; overflow: hidden">
  <div style="display: flex; gap: 8px; align-items: center; height: 14px; padding: 0 8px">
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #E9695E; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #F2BE4E; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
    <span style="width: 12px; height: 12px; border-radius: 50%; background: #62C356; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.12)"></span>
  </div>
  <div style="display: flex; align-items: baseline; gap: 8px; padding: 30px 12px 26px">
    <span style="font-family: Newsreader, Georgia, serif; font-size: 28px; font-style: italic; letter-spacing: -0.01em; line-height: 1">Folio</span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{s.today.color}}; background: {{s.today.bg}}; font-weight: {{s.today.w}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18h16"></path><path d="M7 18a5 5 0 0 1 10 0"></path><path d="M12 5v3"></path><path d="M5.6 10.6l1.5 1.2"></path><path d="M18.4 10.6l-1.5 1.2"></path></svg>
      Today
    </a>
    <a href="Library.dc.html" style="display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{s.library.color}}; background: {{s.library.bg}}; font-weight: {{s.library.w}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5c2.6-1 5.6-1 9 1 3.4-2 6.4-2 9-1v13c-2.6-1-5.6-1-9 1-3.4-2-6.4-2-9-1z"></path><path d="M12 6.5v13"></path></svg>
      Library
    </a>
    <a href="Notebook.dc.html" style="display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{s.notebook.color}}; background: {{s.notebook.bg}}; font-weight: {{s.notebook.w}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h11.5a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6z"></path><path d="M9 3.5v17"></path><path d="M12 8.5h3.5"></path><path d="M12 11.5h3.5"></path></svg>
      Notebook
    </a>
    <a href="Schedule.dc.html" style="display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{s.schedule.color}}; background: {{s.schedule.bg}}; font-weight: {{s.schedule.w}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
      Schedule
    </a>
    <a href="Appearance.dc.html" style="display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; color: {{s.appearance.color}}; background: {{s.appearance.bg}}; font-weight: {{s.appearance.w}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5s6 6.4 6 10.8a6 6 0 0 1-12 0C6 9.9 12 3.5 12 3.5z"></path><path d="M9.2 14.6a2.9 2.9 0 0 0 2.6 2.7"></path></svg>
      Appearance
    </a>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Brief.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 16px; border-radius: 12px; background: #F6F1E7; border: 1px solid #E1D8C6; text-decoration: none; color: #23201B; position: relative; overflow: hidden">
    <img src="../assets/wc-ochre.png" alt="" style="position: absolute; right: -70px; top: -44px; width: 190px; height: 135px; mix-blend-mode: multiply; opacity: 0.7">
    <span style="font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #5A554C; position: relative">Next edition</span>
    <span style="font-family: Newsreader, Georgia, serif; font-size: 19px; line-height: 1.2; position: relative">Tonight, 21:00</span>
    <span style="font-size: 13px; color: #5A554C; position: relative">The Brief · honeybees</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","library","notebook","schedule","appearance"],"default":"today"},"$preview":{"width":232,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today';
    const mk = (k) => a === k
      ? { bg: '#E3D9C5', color: '#23201B', w: '500' }
      : { bg: 'transparent', color: '#5A554C', w: '400' };
    return { s: { today: mk('today'), library: mk('library'), notebook: mk('notebook'), schedule: mk('schedule'), appearance: mk('appearance') } };
  }
}
</script>
</body>
</html>
