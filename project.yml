name: Folio
options:
  bundleIdPrefix: app.folio
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"

targets:
  Folio:
    type: application
    platform: macOS
    sources:
      - path: Folio
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
    info:
      path: Folio/Support/Info.plist
      properties:
        CFBundleDisplayName: Folio
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.books
        LSMinimumSystemVersion: "15.0"
        ATSApplicationFontsPath: Fonts
        NSHumanReadableCopyright: ""
    entitlements:
      path: Folio/Support/Folio.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folio.Folio
        PRODUCT_NAME: Folio
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    scheme:
      testTargets:
        - FolioTests

  FolioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FolioTests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.folio.FolioTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Folio.app/Contents/MacOS/Folio"
        BUNDLE_LOADER: "$(TEST_HOST)"
